<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-label="Check before the AI acts, and record everything it does">
  <title>Check before the AI acts, and record everything it does</title>
  <style>
    .ink { fill: #1f2328; } .quiet { fill: #59636e; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .key { fill: #0969da; fill-opacity: 0.08; stroke: #0969da; stroke-width: 2; }
    .line { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .head { fill: #8c959f; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; } .quiet { fill: #9198a1; }
      .box { stroke: #6e7681; } .line { stroke: #6e7681; } .head { fill: #6e7681; }
      .key { fill: #4493f8; stroke: #4493f8; fill-opacity: 0.12; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <text class="ink" x="24" y="30" font-size="15" font-weight="600">Check before the AI acts. Record everything it does.</text>

  <!-- Row 1: the check path -->
  <rect class="box" x="24" y="56" width="154" height="68" rx="8"/>
  <text class="ink" x="101" y="84" font-size="13" font-weight="600" text-anchor="middle">Incoming text</text>
  <text class="quiet" x="101" y="104" font-size="11.5" text-anchor="middle">messages, docs, pages</text>

  <rect class="box" x="206" y="56" width="154" height="68" rx="8"/>
  <text class="ink" x="283" y="84" font-size="13" font-weight="600" text-anchor="middle">Hidden-text</text>
  <text class="ink" x="283" y="101" font-size="13" font-weight="600" text-anchor="middle">detectors</text>
  <text class="quiet" x="283" y="118" font-size="11.5" text-anchor="middle">deobfuscate, unicode-int.</text>

  <rect class="box" x="388" y="56" width="154" height="68" rx="8"/>
  <text class="ink" x="465" y="84" font-size="13" font-weight="600" text-anchor="middle">Split-Brain</text>
  <text class="ink" x="465" y="101" font-size="13" font-weight="600" text-anchor="middle">Harness</text>
  <text class="quiet" x="465" y="118" font-size="11.5" text-anchor="middle">injection, escalation</text>

  <rect class="box" x="570" y="56" width="154" height="68" rx="8"/>
  <text class="ink" x="647" y="84" font-size="13" font-weight="600" text-anchor="middle">AI model</text>
  <text class="ink" x="647" y="101" font-size="13" font-weight="600" text-anchor="middle">and its tools</text>
  <text class="quiet" x="647" y="118" font-size="11.5" text-anchor="middle">acts only if passed</text>

  <path class="line" d="M178 90H206" marker-end="url(#arrow)"/>
  <path class="line" d="M360 90H388" marker-end="url(#arrow)"/>
  <path class="line" d="M542 90H570" marker-end="url(#arrow)"/>

  <!-- Row 2: the record -->
  <rect class="box" x="24" y="196" width="200" height="72" rx="8"/>
  <text class="ink" x="124" y="222" font-size="13" font-weight="600" text-anchor="middle">Other event sources</text>
  <text class="quiet" x="124" y="241" font-size="11.5" text-anchor="middle">farm controllers, warehouse</text>
  <text class="quiet" x="124" y="257" font-size="11.5" text-anchor="middle">systems, machine state</text>

  <rect class="key" x="272" y="196" width="216" height="72" rx="8"/>
  <text class="ink" x="380" y="222" font-size="13" font-weight="600" text-anchor="middle">Harborlight Witness</text>
  <text class="quiet" x="380" y="241" font-size="11.5" text-anchor="middle">signed, append-only record</text>
  <text class="quiet" x="380" y="257" font-size="11.5" text-anchor="middle">any edit or cut is detected</text>

  <rect class="box" x="536" y="196" width="188" height="72" rx="8"/>
  <text class="ink" x="630" y="222" font-size="13" font-weight="600" text-anchor="middle">Off-site mirror</text>
  <text class="quiet" x="630" y="241" font-size="11.5" text-anchor="middle">a copy of the signed head,</text>
  <text class="quiet" x="630" y="257" font-size="11.5" text-anchor="middle">catches a rewritten past</text>

  <path class="line" d="M440 124V196" marker-end="url(#arrow)"/>
  <text class="quiet" x="432" y="164" font-size="11.5" text-anchor="end">every decision</text>
  <path class="line" d="M647 124V160H470V196" marker-end="url(#arrow)"/>
  <text class="quiet" x="655" y="152" font-size="11.5">every action</text>
  <path class="line" d="M224 232H272" marker-end="url(#arrow)"/>
  <path class="line" d="M488 232H536" marker-end="url(#arrow)"/>

  <text class="quiet" x="24" y="306" font-size="11.5">SLATE applies the same tamper-evident custody to police evidence rooms, on a department-run node.</text>
</svg>
